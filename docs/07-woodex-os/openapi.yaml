openapi: 3.1.0
info:
  title: WOODEX OS Public API
  version: 1.0.0-draft
  description: |
    Contract between the WOODEX storefront (React SPA) and WOODEX OS (Laravel 13 + Livewire 4).

    Implemented by `routes/storefront.php` inside WOODEX OS; coexists with the existing
    `/api/public/*` endpoints (leads, chat, legacy bridge, MCP) without changing them.

    Conventions
    - Money is an integer number of Pakistani Rupees (PKR), never a float.
    - Timestamps are ISO-8601 UTC strings.
    - Every collection response uses the `data` + `meta` envelope.
    - Errors use the `error` envelope with a stable machine-readable `code`.
    - Mutating endpoints that can be retried require an `Idempotency-Key` header.
    - Public catalog endpoints are cacheable; add `ETag` and honour `If-None-Match`.
servers:
  - url: https://woodex.com.pk/api/storefront/v1
    description: Production (WOODEX OS, routes/storefront.php)
  - url: https://staging.woodex.com.pk/api/storefront/v1
    description: Staging
  - url: http://127.0.0.1:8000/api/storefront/v1
    description: Local artisan serve

tags:
  - name: Catalog
  - name: Merchandising
  - name: Content
  - name: Quotes
  - name: Cart
  - name: Orders
  - name: Payments
  - name: Leads
  - name: Auth
  - name: B2B
  - name: Warranty
  - name: Support
  - name: Markets
  - name: Design
  - name: Admin

security:
  - bearerAuth: []

paths:
  /products:
    get:
      tags: [Catalog]
      summary: Paginated product list with filters
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Free-text search over name and description }
        - { name: category, in: query, schema: { type: string }, description: Category or subcategory id }
        - { name: series, in: query, schema: { type: string } }
        - { name: material, in: query, schema: { type: string } }
        - { name: color, in: query, schema: { type: string } }
        - { name: min_price, in: query, schema: { type: integer, minimum: 0 } }
        - { name: max_price, in: query, schema: { type: integer, minimum: 0 } }
        - { name: in_stock, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, enum: [featured, price_asc, price_desc, newest, rating] }, description: Defaults to featured }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 60, default: 24 } }
      responses:
        '200':
          description: Product page
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Collection'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ProductSummary' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /products/{slug}:
    get:
      tags: [Catalog]
      summary: Single product by slug
      security: []
      parameters:
        - { $ref: '#/components/parameters/Slug' }
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }

  /categories:
    get:
      tags: [Catalog]
      summary: Category tree (groups → subcategories)
      security: []
      responses:
        '200':
          description: Category tree
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CategoryNode' }

  /series:
    get:
      tags: [Catalog]
      summary: Furniture series (Ek, Infinity, Woodex, Cubicle, Nova)
      security: []
      responses:
        '200':
          description: Series list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Series' }

  /materials:
    get:
      tags: [Catalog]
      summary: Materials and finishes library
      security: []
      parameters:
        - { name: family, in: query, schema: { type: string, enum: [wood, laminate, metal, fabric] } }
        - { name: brightness, in: query, schema: { type: string, enum: [light, medium, dark] } }
      responses:
        '200':
          description: Materials
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Material' }

  /room-packages:
    get:
      tags: [Merchandising]
      summary: Bundled room packages
      security: []
      responses:
        '200':
          description: Packages
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/RoomPackage' }

  /projects:
    get:
      tags: [Merchandising]
      summary: Portfolio projects
      security: []
      parameters:
        - { name: category, in: query, schema: { type: string } }
      responses:
        '200':
          description: Projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Project' }

  /projects/{slug}:
    get:
      tags: [Merchandising]
      summary: Project case study
      security: []
      parameters:
        - { $ref: '#/components/parameters/Slug' }
      responses:
        '200':
          description: Project
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Project' }
        '404': { $ref: '#/components/responses/NotFound' }

  /showrooms:
    get:
      tags: [Merchandising]
      summary: Showroom locations
      security: []
      responses:
        '200':
          description: Showrooms
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Showroom' }

  /posts:
    get:
      tags: [Content]
      summary: Blog posts
      security: []
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 12 } }
      responses:
        '200':
          description: Posts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Collection'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PostSummary' }

  /posts/{slug}:
    get:
      tags: [Content]
      summary: Blog post
      security: []
      parameters:
        - { $ref: '#/components/parameters/Slug' }
      responses:
        '200':
          description: Post
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Post' }
        '404': { $ref: '#/components/responses/NotFound' }

  /services:
    get:
      tags: [Content]
      summary: Services
      security: []
      responses:
        '200':
          description: Services
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Service' }

  /quotes:
    post:
      tags: [Quotes]
      summary: Submit a quotation request (B2B or B2C)
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteRequest' }
      responses:
        '201':
          description: Quote created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Quote' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /quotes/{number}:
    get:
      tags: [Quotes]
      summary: Read a quote by number and access token
      security: []
      parameters:
        - { name: number, in: path, required: true, schema: { type: string }, example: WQ-2026-0142 }
        - { name: token, in: query, required: true, schema: { type: string }, description: Unguessable token returned at creation }
      responses:
        '200':
          description: Quote
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Quote' }
        '404': { $ref: '#/components/responses/NotFound' }

  /quotes/{number}/accept:
    post:
      tags: [Quotes]
      summary: Accept a quote (customer side)
      security: []
      parameters:
        - { name: number, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, signature_name]
              properties:
                token: { type: string }
                signature_name: { type: string }
                purchase_order_no: { type: string }
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Quote' }
        '409':
          description: Quote already accepted, rejected or expired

  /quotes/{number}/pdf:
    get:
      tags: [Quotes]
      summary: Download the quotation PDF
      security: []
      parameters:
        - { name: number, in: path, required: true, schema: { type: string } }
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }

  /carts:
    post:
      tags: [Cart]
      summary: Create a cart (guest or authenticated)
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                currency: { type: string, default: PKR }
      responses:
        '201':
          description: Cart
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Cart' }

  /carts/{id}/items:
    patch:
      tags: [Cart]
      summary: Add, update or remove a cart line
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, quantity]
              properties:
                product_id: { type: string }
                variant_id: { type: string }
                quantity: { type: integer, minimum: 0, description: 0 removes the line }
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Cart' }
        '409':
          description: Insufficient stock

  /checkout/quote:
    post:
      tags: [Cart, Orders]
      summary: Price a basket without creating anything
      description: |
        The customer's basket lives in the browser, so every call sends the lines again and
        they are re-priced here at current prices, discounts, tax and shipping. Nothing is
        written: no cart row, no reservation, no sequence number. A quote is safe to call on
        every quantity click, so it shares the catalog's rate limit rather than the checkout's.

        The totals returned by this endpoint and the total charged by `POST /checkout` come
        from the same calculator, so the summary a customer approves is the amount they owe.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BasketRequest' }
      responses:
        '200':
          description: Priced basket
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/BasketTotals' }
        '422':
          description: |
            A line could not be priced. The field error names the line, and `code` is one of
            `product_unavailable`, `variant_unavailable` or `price_missing` so the basket can
            mark the row instead of showing a message about the whole page.
          $ref: '#/components/responses/ValidationError'
        '429': { $ref: '#/components/responses/RateLimited' }

  /checkout:
    post:
      tags: [Orders]
      summary: Place an order from a basket
      description: |
        Opens a cart, fills it, addresses it and places it in one transaction. Stock is
        reserved, the order number is allocated from a sequence, and the invoice is issued
        before the response is written — an order that exists without its invoice is not a
        state this endpoint can return.

        Re-pricing happens here too. The lines are priced from the catalog at the moment of
        the order, never from a `total` the browser sends.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutRequest' }
      responses:
        '201':
          description: Order placed, invoice issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PlacedOrder' }
        '409':
          description: |
            Insufficient stock. `error.code` is `insufficient_stock` and `shortfalls` lists
            each line the shelf cannot cover with the quantity that is actually available —
            the useful part of the answer, because the customer can adjust one line.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code: { type: string, const: insufficient_stock }
                      message: { type: string }
                  shortfalls:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /orders/{number}:
    get:
      tags: [Orders]
      summary: Read an order (owner or token)
      security: []
      parameters:
        - { name: number, in: path, required: true, schema: { type: string }, example: WO-2026-0311 }
        - { name: token, in: query, schema: { type: string } }
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/NotFound' }

  /payments/intents:
    post:
      tags: [Payments]
      summary: Start a payment (returns a hosted redirect URL)
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_number, gateway]
              properties:
                order_number: { type: string }
                gateway: { type: string, enum: [safepay, jazzcash, easypaisa, bank_transfer, cod] }
                return_url: { type: string, format: uri }
      responses:
        '201':
          description: Intent created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      intent_id: { type: string }
                      redirect_url: { type: string, format: uri }
                      expires_at: { type: string, format: date-time }

  /webhooks/{gateway}:
    post:
      tags: [Payments]
      summary: Gateway callback (signature-verified server-to-server)
      security: []
      parameters:
        - { name: gateway, in: path, required: true, schema: { type: string, enum: [safepay, jazzcash, easypaisa] } }
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Acknowledged }
        '401': { description: Invalid signature }

  /leads:
    post:
      tags: [Leads]
      summary: Contact / enquiry / B2B lead
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone, message]
              properties:
                name: { type: string, maxLength: 120 }
                email: { type: string, format: email }
                phone: { type: string, pattern: '^\+?92[0-9]{9,11}$' }
                company: { type: string }
                city: { type: string }
                message: { type: string, maxLength: 2000 }
                source: { type: string, enum: [contact, b2b, custom_design, product, showroom, newsletter] }
                product_id: { type: string }
                utm:
                  type: object
                  additionalProperties: { type: string }
      responses:
        '201': { description: Lead stored and routed }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a retail customer
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 10 }
                phone: { type: string }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthToken' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and receive a Sanctum token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthToken' }
        '401': { description: Invalid credentials }

  /auth/me:
    get:
      tags: [Auth]
      summary: Current user and company context
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /company/users:
    get:
      tags: [B2B]
      summary: List users in the caller's company
      responses:
        '200':
          description: Company users
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [B2B]
      summary: Invite a company user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [admin, buyer, approver, finance] }
                spending_limit: { type: integer, minimum: 0 }
      responses:
        '201': { description: Invited }

  /company/quotes:
    get:
      tags: [B2B]
      summary: Quotes belonging to the caller's company
      responses:
        '200':
          description: Quotes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Collection'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Quote' }

  /admin/quotes:
    get:
      tags: [Admin]
      summary: Quote pipeline for staff
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, submitted, under_review, negotiated, accepted, rejected, expired, converted_to_order] } }
        - { name: owner, in: query, schema: { type: string } }
      responses:
        '200': { description: Quotes }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/quotes/{number}/state:
    post:
      tags: [Admin]
      summary: Transition a quote state
      parameters:
        - { name: number, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { type: string }
                note: { type: string }
      responses:
        '200': { description: Updated quote }
        '409': { description: Illegal transition }

  /showrooms/{slug}/appointments:
    post:
      tags: [Merchandising]
      summary: Book a showroom visit
      description: Creates a CRM visit and a staff-calendar entry. Confirmation by email and WhatsApp template.
      security: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone, date, slot]
              properties:
                name: { type: string, maxLength: 120 }
                phone: { type: string, maxLength: 32 }
                email: { type: string, format: email }
                date: { type: string, format: date }
                slot: { type: string, example: "15:00" }
                party_size: { type: integer, minimum: 1, maximum: 20, default: 2 }
                interests: { type: array, items: { type: string } }
                note: { type: string, maxLength: 1000 }
      responses:
        '201':
          description: Appointment booked
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      reference: { type: string, example: "APT-2026-0142" }
                      status: { type: string, enum: [requested, confirmed] }
                      starts_at: { type: string, format: date-time }
        '409': { description: Slot unavailable }
        '422': { $ref: '#/components/responses/ValidationError' }

  /faqs:
    get:
      tags: [Content]
      summary: FAQ entries from the content library
      security: []
      parameters:
        - { name: category, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: string }, description: Limit to FAQs placed on this page }
      responses:
        '200':
          description: FAQs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Faq' }

  /warranties:
    post:
      tags: [Warranty]
      summary: Register a product warranty
      description: Accepts an order number plus phone or serial; no login required. Returns a claim token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_number, phone]
              properties:
                order_number: { type: string, example: "WDX-10231" }
                phone: { type: string, maxLength: 32 }
                sku: { type: string }
                serial: { type: string }
                purchased_at: { type: string, format: date }
                invoice: { type: string, format: uri, description: Uploaded invoice reference }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Warranty' }
        '404': { description: Order not found or phone does not match }

  /warranties/{token}:
    get:
      tags: [Warranty]
      summary: Warranty status by share token
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Warranty
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Warranty' }
        '404': { description: Unknown token }

  /warranties/claims:
    post:
      tags: [Warranty]
      summary: Raise a warranty claim
      description: Creates a service job linked to the warranty and its order.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, symptom]
              properties:
                token: { type: string }
                symptom: { type: string, maxLength: 2000 }
                photos: { type: array, items: { type: string, format: uri }, maxItems: 6 }
                preferred_visit: { type: string, format: date }
      responses:
        '201':
          description: Claim opened
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      claim_number: { type: string, example: "WC-2026-0031" }
                      status: { type: string, enum: [submitted, triaged, approved, rejected, resolved] }
        '422': { $ref: '#/components/responses/ValidationError' }

  /support/cases:
    post:
      tags: [Support]
      summary: Open a support case
      description: Creates a Conversation on the web_form channel with an SLA clock and a case number.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, message]
              properties:
                name: { type: string, maxLength: 120 }
                email: { type: string, format: email }
                phone: { type: string, maxLength: 32 }
                subject: { type: string, maxLength: 200 }
                message: { type: string, maxLength: 5000 }
                topic: { type: string, enum: [order, product, warranty, dealer, other] }
                order_number: { type: string }
                attachments: { type: array, items: { type: string, format: uri }, maxItems: 5 }
      responses:
        '201':
          description: Case opened
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      case_number: { type: string, example: "SC-2026-1042" }
                      token: { type: string, description: Used to read the case without an account }
                      sla_due_at: { type: string, format: date-time }
        '429': { description: Rate limited }

  /support/cases/{number}:
    get:
      tags: [Support]
      summary: Read a case
      security: []
      parameters:
        - { name: number, in: path, required: true, schema: { type: string } }
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Case with messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SupportCase' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /support/cases/{number}/messages:
    post:
      tags: [Support]
      summary: Reply to a case
      security: []
      parameters:
        - { name: number, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, body]
              properties:
                token: { type: string }
                body: { type: string, maxLength: 5000 }
      responses:
        '201': { description: Message appended }

  /dealer-applications:
    post:
      tags: [B2B]
      summary: Apply to become a dealer
      description: Creates a deal in the Dealer Onboarding pipeline. Approval sets the commerce customer group to Dealer and applies the dealer price list.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [business_name, contact_name, phone, city]
              properties:
                business_name: { type: string, maxLength: 200 }
                contact_name: { type: string, maxLength: 120 }
                phone: { type: string, maxLength: 32 }
                email: { type: string, format: email }
                city: { type: string, maxLength: 80 }
                ntn: { type: string, maxLength: 20, description: Tax number, verified before approval }
                showroom_area: { type: integer, description: Square feet }
                est_monthly_volume: { type: integer, description: PKR per month }
                brands_carried: { type: array, items: { type: string } }
                documents: { type: array, items: { type: string, format: uri }, maxItems: 4 }
      responses:
        '201':
          description: Application received
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token: { type: string }
                      stage: { type: string, enum: [applied, verifying, approved, rejected] }
        '409': { description: An application already exists for this business }

  /dealer-applications/{token}:
    get:
      tags: [B2B]
      summary: Check application status
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Application status }
        '404': { description: Unknown token }

  /markets:
    get:
      tags: [Markets]
      summary: Export markets
      security: []
      responses:
        '200':
          description: Markets
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Market' }

  /markets/{slug}:
    get:
      tags: [Markets]
      summary: Market detail with enquiry form context
      security: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Market
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Market' }
        '404': { description: Not found }

  /custom-design/requests:
    post:
      tags: [Design]
      summary: Submit a custom design brief
      description: Creates a Project in Intake, a draft quote, and a conversation thread.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone, space, brief]
              properties:
                name: { type: string, maxLength: 120 }
                phone: { type: string, maxLength: 32 }
                email: { type: string, format: email }
                space: { type: string, enum: [living, bedroom, dining, kitchen, office, retail, other] }
                style: { type: string, maxLength: 80 }
                dimensions: { type: string, maxLength: 120 }
                budget_band: { type: string, enum: [under_250k, 250k_750k, 750k_2m, above_2m] }
                target_date: { type: string, format: date }
                brief: { type: string, maxLength: 5000 }
                references: { type: array, items: { type: string, format: uri }, maxItems: 8 }
      responses:
        '201':
          description: Brief accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token: { type: string }
                      project_code: { type: string, example: "PRJ-2026-0217" }
                      quote_draft: { type: string, example: "WI-2026-0089" }
        '429': { description: Rate limited }

  /custom-design/requests/{token}:
    get:
      tags: [Design]
      summary: Track a custom design brief
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Brief, project stage and designer notes }
        '404': { description: Unknown token }

  /coupons/validate:
    post:
      tags: [Cart]
      summary: Validate a coupon against a live cart
      description: Returns the discount the coupon would apply, or the reason it was rejected. Never trusts a client-sent total.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cart_id, code]
              properties:
                cart_id: { type: string }
                code: { type: string, maxLength: 40 }
      responses:
        '200':
          description: Validity and effect
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      valid: { type: boolean }
                      discount_minor: { type: integer, description: Discount in paisa }
                      reason:
                        type: string
                        nullable: true
                        enum: [expired, usage_limit, min_spend, not_stackable, unknown_code, customer_limit, null]
        '422': { $ref: '#/components/responses/ValidationError' }

  /shipping/methods:
    get:
      tags: [Cart]
      summary: Shipping options for a cart and destination
      security: []
      parameters:
        - { name: cart_id, in: query, required: true, schema: { type: string } }
        - { name: city, in: query, required: false, schema: { type: string } }
        - { name: postal_code, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Available methods with rates
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string, example: flat }
                        label: { type: string, example: Standard delivery }
                        rate_minor: { type: integer }
                        eta_days: { type: integer }
                        is_cod: { type: boolean }

  /products/{slug}/availability:
    get:
      tags: [Catalog]
      summary: Live stock and lead time for a product
      security: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - { name: city, in: query, schema: { type: string }, description: Show showroom-specific stock }
      responses:
        '200':
          description: Availability
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      in_stock: { type: boolean }
                      qty: { type: integer }
                      lead_time_days: { type: integer }
                      made_to_order: { type: boolean }
                      by_source:
                        type: array
                        items:
                          type: object
                          properties:
                            source: { type: string, example: Lahore }
                            qty: { type: integer }

  /orders:
    get:
      tags: [Orders]
      summary: The signed-in customer's orders
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Collection'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Order' }
        '401': { description: Unauthenticated }


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Laravel Sanctum personal access token.

  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: validation_failed
              message: The given data was invalid.
              fields:
                phone: [The phone number format is invalid.]
    RateLimited:
      description: Too many requests
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Collection:
      type: object
      properties:
        data: { type: array, items: {} }
        meta:
          type: object
          properties:
            page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }
            last_page: { type: integer }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: not_found }
            message: { type: string }
            fields:
              type: object
              additionalProperties:
                type: array
                items: { type: string }

    Money:
      type: integer
      minimum: 0
      description: Whole Pakistani Rupees.

    ProductSummary:
      type: object
      required: [id, slug, name, price, in_stock]
      properties:
        id: { type: string, example: ballmer-executive-desk }
        slug: { type: string, example: ballmer-executive-desk }
        name: { type: string, example: BALLMER Executive Desk }
        category: { type: string, example: office-tables }
        subcategory: { type: string, example: executive-tables }
        series: { type: string, example: ek-series }
        price: { $ref: '#/components/schemas/Money' }
        original_price: { $ref: '#/components/schemas/Money' }
        short_description: { type: string }
        thumbnail: { type: string, format: uri }
        in_stock: { type: boolean }
        is_new: { type: boolean }
        is_best_seller: { type: boolean }
        rating: { type: number, minimum: 0, maximum: 5 }
        reviews: { type: integer, minimum: 0 }

    Product:
      allOf:
        - $ref: '#/components/schemas/ProductSummary'
        - type: object
          properties:
            description: { type: string }
            images:
              type: array
              items: { type: string, format: uri }
            colors:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  hex: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
                  image: { type: string, format: uri }
            specifications:
              type: array
              items:
                type: object
                properties:
                  label: { type: string }
                  value: { type: string }
            features:
              type: array
              items: { type: string }
            materials:
              type: array
              items: { type: string }
            lead_time_days: { type: integer }
            customisable: { type: boolean }

    CategoryNode:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        parent_id: { type: string, nullable: true }
        product_count: { type: integer }
        children:
          type: array
          items: { $ref: '#/components/schemas/CategoryNode' }

    Series:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        tagline: { type: string }
        description: { type: string }
        image: { type: string, format: uri }
        product_count: { type: integer }

    Material:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        family: { type: string, enum: [wood, laminate, metal, fabric] }
        hex: { type: string }
        brightness: { type: string, enum: [light, medium, dark] }
        image: { type: string, format: uri }
        applicable_to:
          type: array
          items: { type: string, enum: [worktop, panel, seating, frame, storage] }

    RoomPackage:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        price: { $ref: '#/components/schemas/Money' }
        seats: { type: integer }
        includes:
          type: array
          items: { type: string }
        image: { type: string, format: uri }

    Project:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        client: { type: string }
        category: { type: string }
        location: { type: string }
        sqft: { type: string }
        description: { type: string }
        cover: { type: string, format: uri }
        images:
          type: array
          items: { type: string, format: uri }

    Showroom:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        city: { type: string }
        address: { type: string }
        phone: { type: string }
        map_url: { type: string, format: uri }
        opening_hours:
          type: object
          additionalProperties: { type: string }

    PostSummary:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string }
        cover: { type: string, format: uri }
        category: { type: string }
        published_at: { type: string, format: date-time }
        reading_minutes: { type: integer }

    Post:
      allOf:
        - $ref: '#/components/schemas/PostSummary'
        - type: object
          properties:
            body_html: { type: string, description: Sanitised server-side. }
            tags:
              type: array
              items: { type: string }

    Service:
      type: object
      properties:
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        body_html: { type: string }
        image: { type: string, format: uri }
        faqs:
          type: array
          items:
            type: object
            properties:
              q: { type: string }
              a: { type: string }

    QuoteRequest:
      type: object
      required: [customer, items]
      properties:
        customer:
          type: object
          required: [name, phone]
          properties:
            name: { type: string }
            phone: { type: string, example: '+923001234567' }
            email: { type: string, format: email }
            company: { type: string }
            location: { type: string, example: DHA Phase 5, Lahore }
            notes: { type: string }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [product_id, quantity]
            properties:
              product_id: { type: string }
              variant_id: { type: string }
              quantity: { type: integer, minimum: 1 }
              note: { type: string }
        source: { type: string, enum: [web, showroom, whatsapp, phone, email] }
        advance_pct: { type: number, minimum: 0, maximum: 100, default: 75 }

    Quote:
      type: object
      properties:
        number: { type: string, example: WQ-2026-0142 }
        token: { type: string, description: Returned once on creation. }
        state: { type: string, enum: [draft, submitted, under_review, negotiated, accepted, rejected, expired, converted_to_order] }
        customer: { type: object, additionalProperties: true }
        items:
          type: array
          items:
            type: object
            properties:
              product_id: { type: string }
              name: { type: string }
              quantity: { type: integer }
              unit_price: { $ref: '#/components/schemas/Money' }
              line_total: { $ref: '#/components/schemas/Money' }
        subtotal: { $ref: '#/components/schemas/Money' }
        discount: { $ref: '#/components/schemas/Money' }
        tax: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
        advance_pct: { type: number }
        advance_amount: { $ref: '#/components/schemas/Money' }
        balance_amount: { $ref: '#/components/schemas/Money' }
        valid_until: { type: string, format: date }
        pdf_url: { type: string, format: uri }
        created_at: { type: string, format: date-time }

    Cart:
      type: object
      properties:
        id: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              line_id: { type: string }
              product_id: { type: string }
              variant_id: { type: string }
              name: { type: string }
              quantity: { type: integer }
              unit_price: { $ref: '#/components/schemas/Money' }
              line_total: { $ref: '#/components/schemas/Money' }
        item_count: { type: integer }
        subtotal: { $ref: '#/components/schemas/Money' }

    # The basket is sent with the request rather than kept server-side: the platform runs on
    # shared hosting, and a session cart would be a read and a write on every quantity click.
    BasketLine:
      type: object
      required: [slug, qty]
      properties:
        slug: { type: string, description: Product slug from `GET /products`, not a SKU }
        qty: { type: integer, minimum: 1, maximum: 10 }
        color:
          type: string
          nullable: true
          description: The finish the customer picked, echoed back for display only

    BasketRequest:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          minItems: 1
          maxItems: 20
          description: A basket above twenty lines is a purchase order and should go through sales.
          items: { $ref: '#/components/schemas/BasketLine' }
        gateway: { type: string, enum: [cod, bank] }
        notes: { type: string, maxLength: 1000 }

    CheckoutRequest:
      allOf:
        - $ref: '#/components/schemas/BasketRequest'
        - type: object
          required: [customer, shipping]
          properties:
            customer:
              type: object
              required: [name, phone]
              properties:
                name: { type: string, maxLength: 120 }
                phone: { type: string, maxLength: 32 }
                email: { type: string, format: email, nullable: true }
            shipping:
              type: object
              required: [line1, city]
              properties:
                line1: { type: string, maxLength: 190 }
                line2: { type: string, nullable: true, maxLength: 190 }
                city: { type: string, maxLength: 80 }
                province: { type: string, maxLength: 80 }
                postcode: { type: string, maxLength: 16 }

    BasketTotals:
      type: object
      properties:
        currency: { type: string, example: PKR }
        lines:
          type: array
          items:
            type: object
            properties:
              slug: { type: string }
              sku: { type: string }
              name: { type: string }
              quantity: { type: integer }
              unit_price_minor: { type: integer }
              unit_price: { type: string, description: Formatted, for display only }
              line_total_minor: { type: integer }
              line_total: { type: string }
              tax_minor: { type: integer }
              tax_rate_bp: { type: integer }
              discount_minor: { type: integer }
              image: { type: string, nullable: true }
              color: { type: string, nullable: true }
        totals:
          type: object
          additionalProperties: true
          description: |
            Every field is integer paisa; `grand_total` is the amount the server will charge,
            including tax and shipping. `lines[].line_total_minor` sums to `grand_total` minus
            shipping, and the endpoint refuses to answer if it does not.
        item_count: { type: integer }
        free_shipping: { type: boolean }
        savings_bp:
          type: integer
          description: Discount as basis points of subtotal, for the "you saved" line

    PlacedOrder:
      type: object
      description: Written once, when the order is placed — not a live projection.
      properties:
        number: { type: string, example: WDX-000042 }
        status: { type: string, enum: [placed, confirmed, in_production, ready, shipped, delivered, cancelled] }
        payment_status: { type: string, enum: [pending, paid, part_paid, refunded] }
        payment_method: { type: string, example: cod }
        currency: { type: string, example: PKR }
        total_minor: { type: integer }
        total: { type: string, description: Formatted, for display only }
        amount_due_minor:
          type: integer
          description: Zero for a prepaid order; the full total for cash on delivery
        placed_at: { type: string, format: date-time }
        invoice_number: { type: string, nullable: true, example: INV-000042 }
        lines:
          type: array
          items:
            type: object
            properties:
              slug: { type: string }
              name: { type: string }
              quantity: { type: integer }
              line_total_minor: { type: integer }
              line_total: { type: string }
        shipping_estimate_days: { type: integer, example: 5 }

    Order:
      type: object
      properties:
        number: { type: string, example: WO-2026-0311 }
        state: { type: string, enum: [pending, confirmed, in_production, ready, shipped, delivered, cancelled] }
        payment_state: { type: string, enum: [unpaid, advance_paid, paid, refunded] }
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        subtotal: { $ref: '#/components/schemas/Money' }
        shipping: { $ref: '#/components/schemas/Money' }
        tax: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
        advance_paid: { $ref: '#/components/schemas/Money' }
        balance_due: { $ref: '#/components/schemas/Money' }
        placed_at: { type: string, format: date-time }

    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        roles:
          type: array
          items: { type: string }
        company:
          type: object
          nullable: true
          properties:
            id: { type: string }
            name: { type: string }
            credit_limit: { $ref: '#/components/schemas/Money' }
            credit_used: { $ref: '#/components/schemas/Money' }
            payment_terms: { type: string, example: 'net_30' }

    AuthToken:
      type: object
      properties:
        data:
          type: object
          properties:
            token: { type: string }
            token_type: { type: string, example: Bearer }
            expires_at: { type: string, format: date-time }
            user: { $ref: '#/components/schemas/User' }

    Faq:
      type: object
      properties:
        id: { type: string }
        question: { type: string }
        answer: { type: string }
        category: { type: string }
        position: { type: integer }
        pages: { type: array, items: { type: string }, description: Page slugs this FAQ is placed on }

    Warranty:
      type: object
      properties:
        id: { type: string }
        token: { type: string }
        order_number: { type: string }
        sku: { type: string }
        product_name: { type: string }
        serial: { type: string }
        purchased_at: { type: string, format: date }
        coverage_months: { type: integer }
        expires_at: { type: string, format: date }
        status: { type: string, enum: [active, expiring, expired, void] }
        claims:
          type: array
          items:
            type: object
            properties:
              claim_number: { type: string }
              status: { type: string, enum: [submitted, triaged, approved, rejected, resolved] }
              opened_at: { type: string, format: date-time }

    SupportCase:
      type: object
      properties:
        case_number: { type: string }
        subject: { type: string }
        status: { type: string, enum: [open, pending_customer, resolved, closed] }
        sla_due_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        messages:
          type: array
          items:
            type: object
            properties:
              author: { type: string, enum: [customer, agent, ai, system] }
              body: { type: string }
              created_at: { type: string, format: date-time }

    Market:
      type: object
      properties:
        slug: { type: string }
        country: { type: string }
        region: { type: string }
        currency: { type: string, example: SAR }
        lead_time_days: { type: integer }
        incoterms: { type: string, example: CIF }
        local_agent: { type: string }
        hero: { type: object, additionalProperties: true }
        notes: { type: string }

    DesignRequest:
      type: object
      properties:
        token: { type: string }
        project_code: { type: string }
        stage: { type: string, enum: [intake, triage, design, quoted, won, lost] }
        quote_draft: { type: string, nullable: true }
        designer_notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
